<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Validaciones RETABET</title>
<style>
/* ============================================================
   Validaciones RETABET · Solicitud de datos de tarjeta
   Interfaz. El contenido vive en contenido.js (window.CONTENIDO).
   Sin librerías externas ni CDN (requisito del entorno Ekasa).
   ============================================================ */
:root{
  --bg:#ffffff; --fg:#1f2a1a; --muted:#5f6b58; --line:#dfe6d6; --panel:#f6f9f0;
  --lime:#A6CE39; --lime-soft:#E8F5C5; --lime-ink:#4d6a10;
  --warn:#b96e00; --warn-soft:#fff2db; --ok:#2f7d32;
  --on-lime:#1f2a1a; --thumb-bg:#ffffff;
  color-scheme:light;
  --font:Arial, Helvetica, sans-serif;
}
/* Modo oscuro: sigue al sistema salvo que el usuario elija claro/oscuro (data-tema) */
@media (prefers-color-scheme: dark){ :root:not([data-tema="claro"]){
  --bg:#11160d; --fg:#e9f0df; --muted:#a7b39a; --line:#2c3524; --panel:#1a2114;
  --lime-soft:#26340f; --lime-ink:#c8e57a; --warn:#f0b24a; --warn-soft:#3a2a10; --ok:#8fd092;
  --thumb-bg:#e9f0df; color-scheme:dark } }
:root[data-tema="oscuro"]{
  --bg:#11160d; --fg:#e9f0df; --muted:#a7b39a; --line:#2c3524; --panel:#1a2114;
  --lime-soft:#26340f; --lime-ink:#c8e57a; --warn:#f0b24a; --warn-soft:#3a2a10; --ok:#8fd092;
  --thumb-bg:#e9f0df; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
[hidden]{display:none!important}

/* Cabecera */
header.app{display:flex;align-items:center;gap:14px;padding:14px 0 10px;border-bottom:4px solid var(--lime)}
header.app button.home{all:unset;display:flex;align-items:center;gap:14px;cursor:pointer}
.logo{height:52px;width:auto;border-radius:8px;display:block;background:#001506}
header.app .tit{border-left:2px solid var(--line);padding-left:14px}
header.app h1{font-size:18px}
header.app p{margin:0;color:var(--muted);font-size:13px}
header.app .ver{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
header.app .tit p{white-space:nowrap}
header.app .ver{display:none}
header.app .asisbtn{margin-left:auto}
@media (max-width:420px){ header.app .tit{display:none} }
@media (max-width:700px){ header.app .tit p{display:none} }

/* Acceso */
.gate{max-width:420px;margin:60px auto;display:grid;gap:14px}
.gate input{width:100%;padding:14px 16px;font-size:18px;border:2px solid var(--line);border-radius:10px}
.gate .err{color:var(--warn);font-size:14px;min-height:1.4em}

/* Pantalla bancos */
.search{margin:18px 0 14px}
.search input{width:100%;padding:14px 16px;font-size:18px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bank{display:flex;flex-direction:column;gap:6px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:14px;background:var(--bg);color:var(--fg);text-align:left;min-height:96px;position:relative}
.bank:hover,.bank:focus-visible{border-color:var(--lime)}
.bank b{font-size:17px}
.bank small{color:var(--muted);font-size:13px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:bold;letter-spacing:.03em}
.bank .tag{margin-top:2px}
.fam{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--lime-soft);color:var(--lime-ink);font-weight:bold}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}
/* Pestañas de medio de pago */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;color:var(--fg);padding:10px 18px;border-radius:9px;font-size:16px;font-weight:bold}
/* Aviso fijo de ingresos sin verificar */
.limite{margin:14px 0 0;padding:10px 14px;border-radius:10px;background:var(--lime-soft);border:1px solid var(--lime);font-size:15px}
.limite b{color:var(--lime-ink)}
/* Opciones del medio (foto, factura, YOID…) */
.opcion{margin-top:14px}
.opcion .nota{margin:12px 0 0;font-size:15px}
h3.sub{font-size:17px;margin:22px 0 8px}
.datos{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:15px}
.datos dt{color:var(--muted)} .datos dd{margin:0;font-weight:bold}
.tabs button[aria-selected="true"]{background:var(--lime);color:var(--on-lime)}
.medio{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--lime);color:var(--lime-ink);font-weight:bold}
.empty{padding:20px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}

/* Ficha */
.crumbs{display:flex;align-items:center;gap:10px;margin:16px 0 6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumbs button{border:0;background:none;color:var(--lime-ink);font-weight:bold;padding:0}
.fichahead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;margin-bottom:6px}
.fichahead h2{font-size:28px}
.meta{font-size:13px;color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:15px}
.notice b{color:var(--warn)}
.blocks{display:grid;gap:14px;margin-top:14px}
section.blk{border:1px solid var(--line);border-radius:10px;overflow:hidden}
section.blk>h3{display:flex;align-items:center;gap:10px;font-size:16px;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
section.blk>h3 .n{width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-size:14px;flex:none}
section.blk>h3 .who{margin-left:auto;font-size:12px;font-weight:normal;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.body{padding:14px}
.say{background:var(--lime-soft);border-radius:8px;padding:12px 14px;font-size:17px}
.say::before{content:"Decir al cliente";display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--lime-ink);margin-bottom:4px}
.copy{margin-top:10px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:14px}
ol.steps{list-style:none;padding:0;margin:0;display:grid;gap:12px;counter-reset:p}
ol.steps li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;counter-increment:p}
ol.steps li::before{content:counter(p);width:26px;height:26px;border-radius:50%;border:2px solid var(--lime);display:grid;place-items:center;font-size:13px;font-weight:bold}
ol.steps li .t{min-width:0}
ol.steps li .t b{display:block}
ol.steps li .t span{color:var(--muted);font-size:14px}
.thumb{border:0;padding:0;background:none;width:64px;height:84px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
ul.check{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.check li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--panel)}
ul.check li .box{width:20px;height:20px;border:2px solid var(--ok);border-radius:5px;flex:none;margin-top:2px}
.result{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.result .thumb{width:84px;height:110px;flex:none}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{border:2px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:12px 16px;font-size:16px;font-weight:bold}
.btn.prim{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn.warnb{border-color:var(--warn);color:var(--warn)}

/* Situaciones */
.cases{display:grid;gap:10px;margin-top:14px}
.case{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.case b{display:block;font-size:16px;margin-bottom:6px}
.case .say{margin-top:6px}

/* FAQ */
.faq{border-top:1px solid var(--line);margin-top:22px;padding-top:14px}
.faq h3{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
details{border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
summary{padding:10px 12px;cursor:pointer;font-weight:bold;font-size:15px}
details .body{border-top:1px solid var(--line)}
footer.band{margin-top:28px;background:var(--lime-soft);border-top:3px solid var(--lime);padding:12px 14px;border-radius:8px;font-size:13px;color:var(--lime-ink)}

/* Visor de capturas */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px;z-index:50}
.lb img{max-width:100%;max-height:92vh;border-radius:8px;background:var(--thumb-bg)}
.lb button{position:absolute;top:12px;right:12px;background:var(--bg);color:var(--fg);border:0;border-radius:8px;padding:8px 12px;font-weight:bold}

/* Asistente */
header.app .asisbtn{padding:8px 12px;font-size:14px;border-color:var(--lime);margin-left:12px;flex:none}
header.app .ver + .asisbtn{margin-left:12px}
header.app .temabtn{padding:8px 12px;font-size:14px;margin-left:8px;flex:none}
.asis textarea{width:100%;min-height:110px;padding:12px 14px;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:10px;resize:vertical;background:var(--bg);color:var(--fg)}
.asis select{width:100%;padding:10px 12px;font:inherit;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.asis label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
.masked{font-size:14px;color:var(--muted);background:var(--panel);border-radius:8px;padding:8px 10px;margin-top:12px}
.masked b{color:var(--fg)}
.resp{border:2px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;display:grid;gap:10px}
.resp.ok{border-color:var(--lime)}
.resp.ia{border-color:var(--warn)}
.resp .lbl{font-size:12px;font-weight:bold;text-transform:uppercase;letter-spacing:.05em}
.resp.ok .lbl{color:var(--lime-ink)}
.resp.ia .lbl{color:var(--warn)}
.resp .links{display:flex;flex-wrap:wrap;gap:8px}
.resp .links button{border:1px solid var(--line);background:var(--bg);color:var(--lime-ink);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:bold}
.wait{color:var(--muted);font-size:15px;margin-top:14px}
.say.ask::before{content:"Pregunta para aclarar con el cliente"}

@media (max-width:480px){ .kv{grid-template-columns:1fr} .fichahead h2{font-size:24px} header.app .ver{display:none} .logo{height:30px} header.app .tit{padding-left:8px;min-width:0} header.app .tit p{display:none} header.app h1{font-size:14px} header.app{gap:6px;flex-wrap:wrap} header.app .asisbtn{margin-left:auto;padding:7px 9px;font-size:13px} header.app .temabtn{margin-left:0;padding:7px 9px;font-size:13px} header.app .temabtn .m{display:none} header.app .temabtn .w{display:inline-block} header.app .temabtn .w::first-letter{text-transform:uppercase} header.app{flex-wrap:nowrap} }
@media print{ .copy,.actions,.btn{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <button class="home" id="btnHome" aria-label="Inicio">
      <img class="logo" src="img/logo-retabet.jpg" alt="RETABET Sports &amp; Casino" width="130" height="52">
      <div class="tit"><h1>Validaciones</h1><p>Titularidad del medio de pago · Uso interno</p></div>
    </button>
    <div class="ver" id="ver"></div>
    <button class="btn asisbtn" id="btnAsis" hidden>Asistente</button>
    <button class="btn temabtn" id="btnTema" aria-label="Cambiar entre modo claro y oscuro" title="Cambiar entre modo claro y oscuro">Modo oscuro</button>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<div id="lb" class="lb" hidden><button id="lbClose">Cerrar ✕</button><img id="lbImg" alt="Captura ampliada"></div>

<script src="contenido.js"></script>
<script>
/* ---------- Configuración ---------- */
// Código de acceso compartido. Solo disuasorio: el fichero es público. Cambiarlo aquí.
const CODIGO_ACCESO = 'valida-1841';
const CLAVE_SESION = 'vr_acceso';
// URL de la función intermediaria del asistente IA (Supabase Edge Function).
// Vacía = asistente IA desactivado: solo se usan las respuestas aprobadas.
// Ejemplo: 'https://<proyecto>.supabase.co/functions/v1/asistente'
const ASISTENTE_URL = (window.VR_CONFIG && window.VR_CONFIG.asistenteUrl) || '';
const ASISTENTE_TIMEOUT_MS = 20000;

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C = window.CONTENIDO;
if (!C) {
  // contenido.js no se ha cargado: normalmente porque index.html se abrió desde dentro del ZIP sin extraerlo.
  document.getElementById('app').innerHTML = '<div class="notice" style="margin-top:24px"><b>Falta contenido.js</b><span>No se ha podido cargar el contenido. Extrae el ZIP completo (Expand-Archive) y abre index.html desde la carpeta extraída, junto a contenido.js y la carpeta capturas.</span></div>';
  throw new Error('contenido.js no cargado');
}
const FAM = {captura:'Captura de pantalla', documento:'Documento del banco', asincrono:'Certificado · tras llamada', presencial:'En oficina del banco', agente:'Lo gestiona un agente', sin_nombre:'Sin nombre · pide factura'};
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
// Medios de pago (tarjeta, Bizum…). Cada uno tiene su regla, frase, comprobaciones y bancos.
const MEDIOS = C.medios;
const medioDe = id => MEDIOS.find(m => m.id === id) || MEDIOS[0];
const bancosDe = id => medioDe(id).bancos.filter(b => b.publicado !== false);
let medioActual = MEDIOS[0].id;
// Un texto (respuesta o situación) aplica a un medio si no indica medios o lo incluye.
const aplica = (x, medio) => !x.medios || x.medios.includes(medio);
// Hash de cada ficha: tarjeta mantiene el formato antiguo (#banco=ing); el resto, #<medio>=<id>.
const hashFicha = (medio, id) => (medio === 'tarjeta' ? 'banco' : medio) + '=' + id;
let hashActual = null; // evita re-pintar cuando el hash lo cambia la propia app
function setHash(h){ hashActual = h; if (location.hash.replace('#','') !== h) location.hash = h; }

/* Abrir en la pantalla que indique el hash (#banco=ing, #situaciones) */
function ruta(){
  $('#btnAsis').hidden = false;
  const h = location.hash.replace('#','');
  const m = h.match(/^([a-z]+)=([a-z0-9-]+)$/);
  if (m) {
    const medio = m[1] === 'banco' ? 'tarjeta' : m[1];
    const b = MEDIOS.some(x => x.id === medio) && bancosDe(medio).find(x => x.id === m[2]);
    if (b) return pintaFicha(b, medio);
  }
  if (h === 'situaciones') return pintaSituaciones(null);
  if (h === 'asistente') return pintaAsistente();
  pintaBancos();
}

/* ---------- Acceso ---------- */
function tieneAcceso(){ try { return sessionStorage.getItem(CLAVE_SESION) === '1'; } catch(e){ return false; } }
function pintaAcceso(){
  $('#app').innerHTML = `<form class="gate" id="gate">
    <h2>Acceso</h2><p class="hint">Introduce el código facilitado por SAC.</p>
    <input id="codigo" type="password" autocomplete="off" placeholder="Código de acceso" autofocus>
    <div class="err" id="err"></div>
    <button class="btn prim" type="submit">Entrar</button></form>`;
  $('#gate').addEventListener('submit', e => {
    e.preventDefault();
    if ($('#codigo').value.trim() === CODIGO_ACCESO) { try{ sessionStorage.setItem(CLAVE_SESION,'1'); }catch(e){} ruta(); }
    else $('#err').textContent = 'Código incorrecto.';
  });
}

/* ---------- Pantalla 1: medio de pago (opciones y bancos) ---------- */
// Bloque de una opción del medio: frase para el cliente, comprobaciones y nota.
let nOpc = 0;
function opcionHTML(o){
  if (!o) return '';
  const id = 'op' + (++nOpc);
  return `<section class="blk opcion"><h3>${esc(o.titulo)}</h3><div class="body">
    ${o.frase ? `<div class="say" id="${id}">${esc(o.frase)}</div><button class="copy" data-copy="${id}">⧉ Copiar frase</button>` : ''}
    ${(o.comprobar||[]).length ? `<ul class="check" style="margin-top:12px">${o.comprobar.map(c => `<li><span class="box"></span><span>${esc(c)}</span></li>`).join('')}</ul>` : ''}
    ${o.nota ? `<p class="nota">${esc(o.nota)}</p>` : ''}</div></section>`;
}
function pintaBancos(){
  setHash('');
  const M = medioDe(medioActual);
  const bancos = bancosDe(medioActual);
  const haySit = C.situaciones.some(x => aplica(x, M.id));
  $('#app').innerHTML = `
    ${C.general.sin_verificar ? `<div class="limite"><b>Hasta 150 €:</b> ${esc(C.general.sin_verificar.texto.replace(/^Ingresos de hasta 150 €: /,''))}</div>` : ''}
    <div class="tabs" role="tablist" aria-label="Medio de pago">${MEDIOS.map(x => `<button role="tab" data-medio="${x.id}" aria-selected="${x.id === medioActual}">${esc(x.nombre)}</button>`).join('')}</div>
    <div class="notice"><b>Regla</b><span>${esc(M.regla.texto)}${M.regla.ejemplo_numero ? ` Ejemplo: <b>${esc(M.regla.ejemplo_numero)}</b>` : ''}</span></div>
    ${opcionHTML(M.principal)}
    ${opcionHTML(M.secundaria)}
    ${(M.datos||[]).length ? `<dl class="datos">${M.datos.map(d => `<dt>${esc(d[0])}</dt><dd>${esc(d[1])}</dd>`).join('')}</dl>` : ''}
    ${bancos.length ? `
    ${M.bancos_titulo ? `<h3 class="sub">${esc(M.bancos_titulo)}</h3>` : ''}
    <div class="search"><input id="q" type="search" placeholder="Escribe el banco del cliente" aria-label="Buscar banco"></div>
    <div class="grid" id="grid"></div>
    <p class="hint">Un toque abre la ficha con los pasos en la app del banco. El buscador acepta nombres parciales y alias (por ejemplo «La Caixa» o «Rural Kutxa»).</p>` : ''}
    <div class="actions"><button class="btn prim" id="btnAsis2">Asistente de respuestas</button>${haySit ? '<button class="btn warnb" id="btnSit">No se puede completar</button>' : ''}</div>
    ${M.aviso_lista ? `<footer class="band">${esc(M.aviso_lista)}</footer>` : ''}`;
  if (bancos.length) {
    const grid = $('#grid');
    const pinta = q => {
      q = norm(q.trim());
      const list = bancos.filter(b => !q || norm(b.nombre).includes(q) || b.alias.some(a => norm(a).includes(q)));
      grid.innerHTML = list.length ? list.map(b => `<button class="bank" data-id="${b.id}"><b>${esc(b.nombre)}</b><small>${esc(FAM[b.familia]||b.familia)}</small>${b.provisional?'<span class="tag">PROVISIONAL</span>':''}</button>`).join('')
        : `<div class="empty">Ningún banco coincide. ${esc(M.aviso_lista || 'Consulta a SAC.')}</div>`;
    };
    pinta('');
    $('#q').addEventListener('input', e => pinta(e.target.value));
    grid.addEventListener('click', e => { const b = e.target.closest('.bank'); if (b) pintaFicha(bancos.find(x => x.id === b.dataset.id), medioActual); });
  }
  document.querySelectorAll('.tabs [data-medio]').forEach(t => t.addEventListener('click', () => { medioActual = t.dataset.medio; pintaBancos(); }));
  if (haySit) $('#btnSit').addEventListener('click', () => pintaSituaciones(null));
  $('#btnAsis2').addEventListener('click', pintaAsistente);
}

/* ---------- Pantalla 2: ficha ---------- */
function thumb(src, alt){ return src ? `<button class="thumb" data-src="capturas/${esc(src)}" aria-label="Ampliar captura"><img src="capturas/${esc(src)}" alt="${esc(alt)}" loading="lazy"></button>` : ''; }
function faqHTML(lista){
  if (!lista.length) return '';
  return lista.map(f => `<details><summary>${esc(f.p)}</summary><div class="body"><div class="say">${esc(f.r)}</div>${f.interno?`<p class="hint">Interno: ${esc(f.interno)}</p>`:''}</div></details>`).join('');
}
function pintaFicha(b, medio){
  medioActual = medio || medioActual;
  const M = medioDe(medioActual);
  setHash(hashFicha(M.id, b.id));
  const g = C.general;

    <div class="blocks">

        <div class="body"><div class="say" id="frase">${esc(b.frase_inicial||M.frase_inicial.texto)}</div><button class="copy" data-copy="frase">⧉ Copiar frase</button></div></section>

        <div class="body"><dl class="kv">
          <dt>Cómo lo envía</dt><dd>${esc(g.entrega.texto)} ${esc(M.entrega_extra || '')} Dirección: <b id="dir">${esc(g.entrega.direccion)}</b> <button class="copy" data-copy="dir" style="margin:0 0 0 6px;padding:4px 8px">⧉</button></dd>
          <dt>Qué registras</dt><dd>${esc(M.registro)}</dd>

  setHash('situaciones');
  $('#app').innerHTML = `

    <footer class="band">${esc(C.general.escalado.texto)}</footer>`;

/* ---------- Asistente (modo híbrido) ----------
   1) Se tapan datos personales del mensaje antes de nada.
   2) Se buscan intenciones con respuesta aprobada (sin IA, sin red).
   3) Si no hay coincidencia, o el trabajador lo pide, se consulta a la IA
      a través de la función intermediaria. La IA solo usa el contenido aprobado. */

// Tapa números de tarjeta (deja 6 primeros + 4 últimos), CVV, DNI/NIE, IBAN, correos y teléfonos.
function enmascara(t){
  let s = String(t);
  s = s.replace(/\b[A-Z]{2}\d{2}(?:[ -]?\d{4}){5}\b/gi, '[IBAN]');
  s = s.replace(/\b\d(?:[ -]?\d){11,18}\b/g, m => {
    const d = m.replace(/\D/g,'');
    const oculto = d.slice(0,6) + '•'.repeat(d.length - 10) + d.slice(-4);
    return oculto.replace(/(.{4})(?=.)/g, '$1 ');
  });
  s = s.replace(/\b(cvv|cvc|cvv2|c[oó]digo de seguridad)\b\s*[:=]?\s*\d{3,4}\b/gi, '$1 [tapado]');
  s = s.replace(/\b[XYZ]\d{7}[A-Z]\b/gi, '[NIE]');
  s = s.replace(/\b\d{8}[ -]?[A-Z]\b/gi, '[DNI]');
  s = s.replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g, '[email]');
  s = s.replace(/(?:\+34[ -]?)?\b[6789]\d{2}[ -]?\d{3}[ -]?\d{3}\b/g, '[teléfono]');
  s = s.replace(/\bpin\b\s*[:=]?\s*\d{4,6}\b/gi, 'PIN [tapado]');
  return s;
}

// Palabras normalizadas del mensaje.
const palabras = t => norm(t).replace(/[^a-z0-9ñ ]/g,' ').split(/\s+/).filter(Boolean);
// Una palabra del patrón coincide si es igual (palabras cortas) o es prefijo (palabras de 4+ letras).
const coincide = (pal, w) => pal.some(x => w.length <= 3 ? x === w : x.startsWith(w));

// Devuelve la mejor intención aprobada o null.
function buscaIntencion(t){
  const pal = palabras(t);
  let mejor = null;
  for (const it of (C.intenciones || [])) {
    for (const pat of it.patrones) {
      if (pat.every(w => coincide(pal, w)) && (!mejor || pat.length > mejor.peso)) mejor = {it, peso: pat.length};
    }
  }
  return mejor ? mejor.it : null;
}

// Resuelve "faq:id" o "sit:id" a {cliente, interno}. Si existe una variante del medio (id-bizum), se usa esa.
function resuelve(ref, medio){
  const [tipo, base] = ref.split(':');
  const lista = tipo === 'faq' ? C.faq_comunes : C.situaciones;
  const id = lista.some(x => x.id === base + '-' + medio) ? base + '-' + medio : base;
  if (tipo === 'faq') {
    const f = C.faq_comunes.find(x => x.id === id);
    return f && {titulo: f.p, cliente: f.r, interno: f.interno, estado: f.estado};
  }
  const s = C.situaciones.find(x => x.id === id);
  return s && {titulo: s.titulo, cliente: s.cliente, interno: s.interno, estado: s.estado};
}

// Bancos del medio indicado mencionados en el mensaje (por nombre o alias).
function bancosEn(t, medio){
  const n = ' ' + palabras(t).join(' ') + ' ';
  return bancosDe(medio).filter(b => [b.nombre].concat(b.alias).some(a => n.includes(' ' + palabras(a).join(' ') + ' ')));
}

let nResp = 0;
function bloqueRespuesta(clase, etiqueta, cliente, interno, fichas, extra, claseSay){
  const id = 'r' + (++nResp);
  const links = (fichas || []).map(b => `<button data-ficha="${esc(b._medio)}:${esc(b.id)}">Ver ficha ${esc(b.nombre)}${b._medio !== 'tarjeta' ? ' (' + esc(medioDe(b._medio).nombre) + ')' : ''}</button>`).join('');
  return `<div class="resp ${clase}"><span class="lbl">${etiqueta}</span>
    <div class="say ${claseSay||''}" id="${id}">${esc(cliente)}</div>
    <div><button class="copy" data-copy="${id}" style="margin:0">⧉ Copiar texto</button></div>
    ${interno ? `<p class="hint" style="margin:0">Interno: ${esc(interno)}</p>` : ''}
    ${links ? `<div class="links">${links}</div>` : ''}${extra || ''}</div>`;
}

function pintaAsistente(){
  setHash('asistente');
  $('#app').innerHTML = `
    <div class="crumbs"><button id="back">← Volver</button><span>/</span><span>Asistente</span></div>
    <h2 style="font-size:26px">Asistente de respuestas</h2>
    <p class="hint">Pega el mensaje del cliente. Primero se buscan respuestas aprobadas; si no hay, la IA redacta un borrador usando solo el contenido de esta herramienta. <b>No pegues nombres, DNI ni números de tarjeta</b>: se tapan automáticamente, pero es mejor no incluirlos.</p>
    <form class="asis" id="fAsis">
      <label for="consulta">Mensaje del cliente</label>
      <textarea id="consulta" maxlength="1000" placeholder="Ej.: no me sale la opción de ver detalle en la app del Santander"></textarea>
      <label for="medioSel">Medio de pago</label>
      <select id="medioSel">${MEDIOS.map(x => `<option value="${x.id}"${x.id === medioActual ? ' selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select>
      <label for="bancoSel">Banco del cliente (opcional)</label>
      <select id="bancoSel"></select>
      <div class="actions"><button class="btn prim" type="submit">Buscar respuesta</button></div>
    </form>
    <div id="salida"></div>`;
  const opcionesBanco = () => { $('#bancoSel').innerHTML = '<option value="">No lo sé / no aplica</option>' + bancosDe($('#medioSel').value).map(b => `<option value="${b.id}">${esc(b.nombre)}</option>`).join(''); };
  opcionesBanco();
  $('#medioSel').addEventListener('change', opcionesBanco);
  $('#back').addEventListener('click', pintaBancos);
  $('#fAsis').addEventListener('submit', e => { e.preventDefault(); responde(false); });
  $('#consulta').focus();
}

// Flujo principal del asistente. forzarIA = true cuando el trabajador pulsa «No es esto».
async function responde(forzarIA){
  const bruto = $('#consulta').value.trim();
  const out = $('#salida');
  if (!bruto) { out.innerHTML = '<p class="wait">Escribe o pega el mensaje del cliente.</p>'; return; }
  const texto = enmascara(bruto);
  // Medio: el seleccionado; si el mensaje habla de Bizum, Bizum.
  let medio = $('#medioSel').value;
  const pw = palabras(texto);
  if (pw.includes('bizum') && MEDIOS.some(x => x.id === 'bizum')) medio = 'bizum';
  else if (pw.some(w => w.startsWith('transferenc') || w === 'yoid') && MEDIOS.some(x => x.id === 'transferencia')) medio = 'transferencia';
  else if (pw.includes('paypal') && MEDIOS.some(x => x.id === 'otros')) medio = 'otros';
  const selId = medio === $('#medioSel').value ? $('#bancoSel').value : '';
  const conMedio = b => Object.assign({}, b, {_medio: medio});
  const fichas = bancosEn(texto, medio).map(conMedio);
  if (selId && !fichas.some(b => b.id === selId)) fichas.unshift(conMedio(bancosDe(medio).find(b => b.id === selId)));
  let html = texto !== bruto ? `<div class="masked">Datos tapados antes de analizar: <b>${esc(texto)}</b></div>` : '';

  const it = forzarIA ? null : buscaIntencion(texto);
  if (it) {
    const r = resuelve(it.respuesta, medio);
    if (r) {
      out.innerHTML = html + bloqueRespuesta('ok', 'Respuesta aprobada · ' + esc(r.titulo), r.cliente, r.interno, fichas,
        `<div><button class="btn" id="noEs" style="padding:8px 12px;font-size:14px">No es esto: preguntar a la IA</button></div>`);
      $('#noEs').addEventListener('click', () => responde(true));
      return;
    }
  }

  if (!ASISTENTE_URL) {
    out.innerHTML = html + bloqueRespuesta('ia', 'Sin respuesta aprobada · asistente IA no activado',
      'Lo consulto con nuestro servicio de atención y le respondo en cuanto pueda.', C.general.escalado.texto, fichas);
    return;
  }

  out.innerHTML = html + '<p class="wait">Consultando al asistente…</p>';
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), ASISTENTE_TIMEOUT_MS);
    const res = await fetch(ASISTENTE_URL, {method:'POST', signal: ctl.signal,
      headers:{'Content-Type':'application/json','x-codigo':CODIGO_ACCESO},
      body: JSON.stringify({consulta: texto, medio, banco: selId ? medio + ':' + selId : null})});
    clearTimeout(tm);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const r = await res.json();
    // La IA devuelve fichas como "medio:id"
    const fIA = (r.fichas || []).map(ref => { const [md, id] = String(ref).split(':'); const b = MEDIOS.some(x => x.id === md) && bancosDe(md).find(x => x.id === id); return b ? Object.assign({}, b, {_medio: md}) : null; }).filter(Boolean);
    const todas = fichas.concat(fIA.filter(b => !fichas.some(f => f.id === b.id && f._medio === b._medio)));
    if (r.tipo === 'respuesta') {
      out.innerHTML = html + bloqueRespuesta('ia', 'Borrador IA · revisa antes de enviar', r.texto_cliente, r.nota_interna, todas);
    } else if (r.tipo === 'aclaracion') {
      out.innerHTML = html + bloqueRespuesta('ia', 'Borrador IA · falta información', r.texto_cliente, r.nota_interna, todas, '', 'ask');
    } else {
      // No cubierto: nunca se muestra texto inventado, solo el escalado aprobado.
      out.innerHTML = html + bloqueRespuesta('ia', 'No cubierto por el contenido · consulta a SAC',
        'Lo consulto con nuestro servicio de atención y le respondo en cuanto pueda.', (r.nota_interna ? r.nota_interna + ' ' : '') + C.general.escalado.texto, todas);
    }
  } catch (err) {
    out.innerHTML = html + bloqueRespuesta('ia', 'El asistente no responde ahora',
      'Lo consulto con nuestro servicio de atención y le respondo en cuanto pueda.', 'Error de conexión con el asistente (' + err.message + '). ' + C.general.escalado.texto, fichas);
  }
}

/* ---------- Eventos globales: copiar, ampliar capturas ---------- */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) {
    const t = document.getElementById(c.dataset.copy).textContent.trim();
    const ok = () => { const old = c.textContent; c.textContent = 'Copiado'; setTimeout(() => c.textContent = old, 1500); };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(ok).catch(() => c.textContent = 'Selecciona y copia');
    else c.textContent = 'Selecciona y copia';
    return;
  }
  const fb = e.target.closest('[data-ficha]');
  if (fb) { const [md, id] = fb.dataset.ficha.split(':'); pintaFicha(bancosDe(md).find(b => b.id === id), md); return; }
  const th = e.target.closest('.thumb');
  if (th) { $('#lbImg').src = th.dataset.src; $('#lb').hidden = false; }
});
$('#lb').addEventListener('click', () => $('#lb').hidden = true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lb').hidden = true; });
$('#btnAsis').addEventListener('click', () => { if (tieneAcceso()) pintaAsistente(); });
$('#btnHome').addEventListener('click', () => { if (tieneAcceso()) pintaBancos(); });
window.addEventListener('hashchange', () => { if (location.hash.replace('#','') === hashActual) return; if (tieneAcceso()) ruta(); });

/* ---------- Tema claro / oscuro ----------
   Por defecto sigue al sistema. La elección del usuario se guarda solo en este navegador. */
const CLAVE_TEMA = 'vr_tema';
function temaActual(){
  const t = document.documentElement.dataset.tema;
  if (t) return t;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
}
function aplicaTema(t){
  if (t) document.documentElement.dataset.tema = t; else delete document.documentElement.dataset.tema;
  // El botón indica el modo al que se cambia al pulsarlo
  $('#btnTema').innerHTML = '<span class="m">Modo </span><span class="w">' + (temaActual() === 'oscuro' ? 'claro' : 'oscuro') + '</span>';
}
let temaGuardado = null;
try { temaGuardado = localStorage.getItem(CLAVE_TEMA); } catch(e){}
aplicaTema(temaGuardado);
$('#btnTema').addEventListener('click', () => {
  const nuevo = temaActual() === 'oscuro' ? 'claro' : 'oscuro';
  aplicaTema(nuevo);
  try { localStorage.setItem(CLAVE_TEMA, nuevo); } catch(e){}
});

/* ---------- Arranque ---------- */
$('#ver').textContent = `Contenido v${C.meta.version_contenido} · ${C.meta.fecha}`;
if (tieneAcceso()) ruta(); else pintaAcceso();
